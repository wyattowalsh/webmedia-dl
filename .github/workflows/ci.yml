name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov
      - run: uv run python -m webmedia_dl.schema_export
      - run: uv run python scripts/validate_bundle.py
      - run: node --test tests/unit/extensions/*.mjs
  swift:
    runs-on: macos-15
    if: false
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests (macOS only)
        run: swift test --package-path apps/WebMediaDLCore
