name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov
      - run: uv run python -m webmedia_dl.schema_export
      - run: uv run python scripts/sync_browser_extensions.py
      - run: git diff --exit-code
      - run: uv run python scripts/validate_bundle.py
      - run: node --test tests/unit/extensions/*.mjs
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests and Apple package builds (macOS only)
        run: bash scripts/build_apple_packages.sh
