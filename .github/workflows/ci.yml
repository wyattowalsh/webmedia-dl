name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov
      - name: Doctor provider version probes
        run: |
          uv run webmedia-dl doctor | tee /tmp/webmedia-dl-doctor.json
          uv run python -c '
          import json
          payload = json.loads(open("/tmp/webmedia-dl-doctor.json", encoding="utf-8").read())
          assert payload["telemetry_default"] is False
          assert payload["drm_circumvention"] is False
          assert payload["apple_devices"]["macos"]["status"] == "BLOCKED"
          for name in ("ytdlp", "gallery-dl", "ffmpeg"):
              item = payload["providers"][name]
              assert item["status"] == "PASS", (name, item)
              assert item["executed"] is True, (name, item)
          for name in (
              "signing_notarization",
              "browser_stores",
              "app_review",
              "legal_review",
              "original_planning_pack",
          ):
              assert payload[name]["status"] == "BLOCKED", (name, payload[name])
          '
      - run: uv run python -m webmedia_dl.schema_export
      - run: uv run python scripts/sync_browser_extensions.py
      - run: uv run python scripts/validate_bundle.py
      - run: git diff --exit-code
      - run: node --test tests/unit/extensions/*.mjs
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests and Apple package builds (macOS only)
        run: bash scripts/build_apple_packages.sh
